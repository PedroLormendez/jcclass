[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "jcclass"
description = "Jenkinson and Collison automated gridded classification"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pedro Herrera-Lormendez"}]
requires-python = ">=3.7"
dynamic = ["version"]
dependencies = [
    "numpy>=1.19.5",
    "xarray>=0.16.2",
    "matplotlib>=3.2.0",
    "pyproj",
    "cartopy>=0.17.0",
    "cftime",
    "netCDF4",
]

[project.optional-dependencies]
dev = ["pytest", "coverage", "flake8"]

[project.urls]
Homepage = "https://github.com/PedroLormendez/jcclass"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools_scm]
write_to = "jcclass/_version.py"
